name: OrangeFox Recovery - Xiaomi 12 (cupid)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: orangefox-cupid-build
  cancel-in-progress: false

jobs:
  build:
    name: Build OrangeFox recovery.img
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      DEVICE: cupid
      DEVICE_PATH: device/xiaomi/cupid
      DEVICE_REPO: https://github.com/yarpiin/twrp_device_xiaomi_cupid.git
      # main = White Wolf v9 (has OTG flags fix, sideload daemon fix, FRP wipe)
      DEVICE_BRANCH: main
      FOX_BRANCH: "12.1"
      ANDROID_JOBS: "4"

    steps:
      - name: Set up swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install build dependencies
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg gperf \
            lib32ncurses-dev lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils lz4 \
            openjdk-17-jdk python3 python-is-python3 rsync unzip wget zip \
            zlib1g-dev

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift || true
          sudo apt-get clean
          sudo docker system prune -af 2>/dev/null || true
          df -h /

      - name: Configure git and repo tool
        run: |
          set -e
          git config --global user.name "OrangeFox Builder"
          git config --global user.email "builder@orangefox.invalid"
          git config --global color.ui false
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync OrangeFox source
        run: |
          set -eo pipefail
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git "$RUNNER_TEMP/orangefox-sync"
          cd "$RUNNER_TEMP/orangefox-sync"
          chmod +x orangefox_sync.sh
          ./orangefox_sync.sh --branch "$FOX_BRANCH" --path "$GITHUB_WORKSPACE/android"
          df -h /

      - name: Clone device tree (main / v9)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/android"
          git clone --depth=1 -b "$DEVICE_BRANCH" "$DEVICE_REPO" "$DEVICE_PATH"

      - name: Patch device tree (OTG + battery + OrangeFox)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/android/$DEVICE_PATH"

          # --- OrangeFox vendorsetup compat ---
          if [ -f vendorsetup.sh ]; then
            sed -i '/^export FOX_VERSION/d' vendorsetup.sh
            grep -q FOX_MAINTAINER_PATCH_VERSION vendorsetup.sh || \
              echo 'export FOX_MAINTAINER_PATCH_VERSION=1' >> vendorsetup.sh
          fi

          # --- battery: force sysfs path used by TWRP legacy battery services ---
          grep -q TW_CUSTOM_BATTERY_PATH BoardConfig.mk || \
            echo 'TW_CUSTOM_BATTERY_PATH := /sys/class/power_supply/battery' >> BoardConfig.mk

          # --- battery: make sure the real charger driver is loaded ---
          if [ -f recovery/root/vendor/lib/modules/1.1/qti_battery_charger_main_m81.ko ]; then
            grep -q qti_battery_charger_main_m81 modules.load.recovery || \
              sed -i '/qti_battery_charger\.ko/a qti_battery_charger_main_m81.ko' modules.load.recovery
          fi

          # --- OTG: enable USB host + correct block nodes (GKI enumerates as sda) ---
          grep -q 'persist.sys.isUsbOtgEnabled' system.prop || \
            echo 'persist.sys.isUsbOtgEnabled=true' >> system.prop
          sed -i -e 's|/usbstorage[[:space:]]\+vfat|/usbstorage     auto|' \
                 -e 's|/dev/block/sdh1|/dev/block/sda1|g' \
                 -e 's|/dev/block/sdh\([[:space:]]\)|/dev/block/sda\1|g' \
                 recovery/root/system/etc/twrp.flags

          echo "=== BoardConfig tail ==="; tail -3 BoardConfig.mk
          echo "=== system.prop ==="; cat system.prop
          echo "=== modules (charger) ==="; grep -i charger modules.load.recovery || true
          echo "=== twrp.flags usbstorage ==="; grep usbstorage recovery/root/system/etc/twrp.flags || true

      - name: Validate build environment
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/android"
          test -f build/envsetup.sh  || { echo "::error::build/envsetup.sh not found"; exit 1; }
          test -d vendor/recovery    || { echo "::error::vendor/recovery missing"; exit 1; }
          test -d bootable/recovery  || { echo "::error::bootable/recovery missing"; exit 1; }
          test -f "$DEVICE_PATH/twrp_cupid.mk" || { echo "::error::twrp_cupid.mk missing"; exit 1; }
          echo "Build env OK"

      - name: Build recovery image
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/android"
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=cupid
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export LC_ALL=C
          export USE_CCACHE=0

          # OrangeFox envsetup uses unbound vars
          set +eu
          source build/envsetup.sh
          set -eo pipefail

          declare -F lunch >/dev/null 2>&1 || { echo "::error::lunch not loaded"; exit 1; }
          lunch twrp_cupid-eng
          mka adbd recoveryimage -j"$ANDROID_JOBS" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify and upload
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/android"
          IMG="out/target/product/cupid/recovery.img"
          test -s "$IMG" || { echo "::error::recovery.img not produced"; exit 1; }
          ls -lh "$IMG"; sha256sum "$IMG"

      - name: Upload recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-cupid-v9-${{ github.run_number }}
          path: android/out/target/product/cupid/recovery.img
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
