name: OrangeFox Recovery - Xiaomi 12 (cupid)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: orangefox-cupid-build
  cancel-in-progress: false

jobs:
  build:
    name: Build recovery.img
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      DEVICE: cupid
      DEVICE_PATH: device/xiaomi/cupid
      DEVICE_REPO: https://github.com/yarpiin/twrp_device_xiaomi_cupid.git
      DEVICE_BRANCH: ofrp-12.1
      FOX_BRANCH: "12.1"
      ANDROID_JOBS: "4"

    steps:
      - name: Install build dependencies
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends             bc bison build-essential ccache curl flex             g++-multilib gcc-multilib git git-lfs gnupg gperf             lib32ncurses-dev lib32readline-dev lib32z1-dev libelf-dev             liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils lz4             openjdk-17-jdk python3 python-is-python3 rsync unzip wget zip             zlib1g-dev

      - name: Configure Git and repo tool
        run: |
          set -e
          git config --global user.name "OrangeFox Builder"
          git config --global user.email "builder@orangefox.invalid"
          git config --global color.ui false
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize OrangeFox source
        run: |
          set -eo pipefail
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git "$RUNNER_TEMP/orangefox-sync"
          cd "$RUNNER_TEMP/orangefox-sync"
          chmod +x orangefox_sync.sh
          ./orangefox_sync.sh --branch "$FOX_BRANCH" --path "$GITHUB_WORKSPACE/android"

      - name: Clone device tree
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/android"
          git clone --depth=1 -b "$DEVICE_BRANCH" "$DEVICE_REPO" "$DEVICE_PATH"
          echo "=== Device tree files ==="
          ls -la "$DEVICE_PATH/"

      - name: Patch device tree for OrangeFox + OTG
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/android/$DEVICE_PATH"
          grep -q TW_INCLUDE_OTG BoardConfig.mk 2>/dev/null || echo TW_INCLUDE_OTG\ :=\ true >> BoardConfig.mk
          echo "=== BoardConfig.mk tail ==="
          tail -5 BoardConfig.mk

      - name: Validate build environment
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/android"
          test -f build/envsetup.sh  || { echo "::error::build/envsetup.sh not found"; exit 1; }
          test -d vendor/recovery    || { echo "::error::vendor/recovery missing"; exit 1; }
          test -d bootable/recovery  || { echo "::error::bootable/recovery missing"; exit 1; }
          test -f "$DEVICE_PATH/twrp_cupid.mk" || { echo "::error::twrp_cupid.mk missing"; exit 1; }
          echo "Build env OK"

      - name: Build recovery image
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/android"
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=cupid
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 8G

          # OrangeFox envsetup.sh uses unbound vars — must disable -u
          set +eu
          source build/envsetup.sh
          # restore pipefail only
          set -eo pipefail

          declare -F lunch >/dev/null 2>&1 || { echo "::error::lunch not loaded"; exit 1; }

          lunch twrp_cupid-eng
          mka adbd recoveryimage -j"$ANDROID_JOBS" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify recovery image
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/android"
          IMG="out/target/product/cupid/recovery.img"
          test -s "$IMG" || { echo "::error::recovery.img not produced"; exit 1; }
          ls -lh "$IMG"
          sha256sum "$IMG"

      - name: Upload recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-cupid-${{ github.run_number }}
          path: android/out/target/product/cupid/recovery.img
          if-no-files-found: error
          retention-days: 30
